name: Build, Deploy and Verify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-interview-simulator
      INSTANCE_ID: i-0a02453e4e5619a0c
      PUBLIC_URL: http://3.7.91.80
      TARGET_PORT: 80
      DOCKERFILE_PATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set default.region "$AWS_REGION"

      - name: Build and push Docker image to ECR
        id: build-and-push
        run: |
          set -e
          ECR_REGISTRY=$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f1)
          ECR_REPOSITORY=$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f2)
          IMAGE_TAG=${GITHUB_SHA::7}
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> $GITHUB_ENV
          echo "FULL_IMAGE=$FULL_IMAGE" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "=== Logging in to Amazon ECR ==="
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          echo "=== Building image $FULL_IMAGE:$IMAGE_TAG ==="
          docker build \
            --pull \
            --platform linux/amd64 \
            -t "$FULL_IMAGE:$IMAGE_TAG" \
            -t "$FULL_IMAGE:latest" \
            -f "$DOCKERFILE_PATH/Dockerfile" .
          echo "=== Pushing images ==="
          docker push "$FULL_IMAGE:$IMAGE_TAG"
          docker push "$FULL_IMAGE:latest"

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker pull ${FULL_IMAGE}:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p ${TARGET_PORT}:80 --name app ${FULL_IMAGE}:latest"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "SSM command sent (ID=$COMMAND_ID). Waiting for completion..."
          while true; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "CommandInvocations[0].Status" --output text)
            if [ "$STATUS" = "Success" ]; then
              echo "SSM Command succeeded."
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" ]]; then
              echo "SSM Command $STATUS."
              exit 1
            else
              echo "SSM Command status: $STATUS - waiting..."
            fi
            sleep 10
          done

      - name: Verify deployment health
        run: |
          set -e
          echo "Waiting for $PUBLIC_URL to become healthy..."
          for i in {1..30}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Health check succeeded with status 200."
              exit 0
            else
              echo "Attempt $i: HTTP status $HTTP_STATUS, retrying in 10s..."
              sleep 10
            fi
          done
          echo "Health check failed after multiple attempts."
          exit 1