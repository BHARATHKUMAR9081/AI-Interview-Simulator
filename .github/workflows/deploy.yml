name: Build, Deploy and Verify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ECR_REPOSITORY_URI: ${{ secrets.ECR_REPOSITORY_URI }}
      INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
      PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
      TARGET_PORT: 80
      DOCKERFILE_PATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $(echo $ECR_REPOSITORY_URI | cut -d'/' -f1)

      - name: Build and Push Docker image
        id: build
        run: |
          set -e
          ECR_REGISTRY=$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f1)
          ECR_REPOSITORY=$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f2)
          IMAGE_TAG=${GITHUB_SHA::7}
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          IMAGE_URI="$FULL_IMAGE:latest"

          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> $GITHUB_ENV
          echo "FULL_IMAGE=$FULL_IMAGE" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

          echo "=== Building image $FULL_IMAGE:$IMAGE_TAG ==="
          docker build \
            --pull \
            --platform linux/amd64 \
            -t "$FULL_IMAGE:$IMAGE_TAG" \
            -t "$FULL_IMAGE:latest" \
            -f "$DOCKERFILE_PATH/Dockerfile" .

          echo "=== Pushing images ==="
          docker push "$FULL_IMAGE:$IMAGE_TAG"
          docker push "$FULL_IMAGE:latest"

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p ${TARGET_PORT}:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command sent (ID=$COMMAND_ID). Waiting for completion..."
          while true; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "CommandInvocations[0].Status" --output text)
            if [ "$STATUS" = "Success" ]; then
              echo "SSM Command succeeded."
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM Command failed with status $STATUS."
              exit 1
            else
              sleep 5
            fi
          done

      - name: Health check
        run: |
          set -e
          echo "Checking health at $PUBLIC_URL"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL")
            if [ "$STATUS" -eq 200 ]; then
              echo "Health check succeeded with status 200."
              exit 0
            else
              echo "Attempt $i: received status $STATUS"
              sleep 10
            fi
          done
          echo "Health check failed after 10 attempts"
          exit 1