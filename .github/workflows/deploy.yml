name: Build and Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REGION: ap-south-1
      ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
      ECR_REPOSITORY: ai-interview-simulator
      INSTANCE_ID: i-0735acdbaa33ddc3f
      PUBLIC_URL: http://3.7.110.41
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli

      - name: Configure Docker for ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push Docker image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building image ${IMAGE_URI}:${{ github.sha }} and ${IMAGE_URI}:latest"
          docker build -t "${IMAGE_URI}:${{ github.sha }}" -t "${IMAGE_URI}:latest" .
          echo "Pushing image ${IMAGE_URI}:${{ github.sha }}"
          docker push "${IMAGE_URI}:${{ github.sha }}"
          echo "Pushing image ${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:latest"

      - name: Deploy to EC2 via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          cat > /tmp/ssm-params.json <<'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $${REGION} | docker login --username AWS --password-stdin $${ECR_REGISTRY}",
              "docker pull $${IMAGE_URI}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $${IMAGE_URI}"
            ]
          }
          SSMPARAMS
          echo "Sending SSM command to instance ${INSTANCE_ID}"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM command id: $COMMAND_ID"
          echo "Waiting for command to complete..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION"

      - name: Verify health endpoint
        run: |
          echo "Checking health at $PUBLIC_URL"
          for i in $(seq 1 10); do
            if curl -fSL "$PUBLIC_URL" >/dev/null 2>&1; then
              echo "Health check succeeded on attempt $i"
              exit 0
            else
              echo "Attempt $i failed; retrying in 10s..."
              sleep 10
            fi
          done
          echo "Health check failed after 10 attempts" && exit 1

      - name: Deployment status
        if: success()
        run: echo "✅ Deployment completed successfully."