name: Build, Deploy and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

# NOTE: Only the actions listed in the rules are used below.
jobs:
  deploy:
    name: Docker Build, ECR Push & EC2 Deploy
    runs-on: ubuntu-latest
    # These are the only secrets that exist for this repository.
    # Do **not** reference any other secrets.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      # Contract values
      INSTANCE_ID: i-0a02453e4e5619a0c
      PUBLIC_URL: http://3.7.91.80
      TARGET_PORT: 80
      ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-interview-simulator
      DOCKERFILE_PATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to ECR
        id: build-and-push
        run: |
          set -e
          # Resolve registry and repository name from the full URI
          ECR_REGISTRY=$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f1)
          ECR_REPOSITORY=$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f2)
          IMAGE_TAG=${GITHUB_SHA::7}   # short commit SHA
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"

          # Persist values for later steps
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> $GITHUB_ENV
          echo "FULL_IMAGE=$FULL_IMAGE" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

          echo "=== Logging in to Amazon ECR ==="
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          echo "=== Building image $FULL_IMAGE:$IMAGE_TAG ==="
          docker build \
            --pull \
            --platform linux/amd64 \
            -t "$FULL_IMAGE:$IMAGE_TAG" \
            -t "$FULL_IMAGE:latest" \
            -f "$DOCKERFILE_PATH/Dockerfile" .

          echo "=== Pushing images ==="
          docker push "$FULL_IMAGE:$IMAGE_TAG"
          docker push "$FULL_IMAGE:latest"

      - name: Deploy to EC2 (via SSM)
        id: deploy-ec2
        run: |
          set -e
          #--------------------------------------------------------------------
          # Build the JSON payload for the SSM command
          #--------------------------------------------------------------------
          cat > /tmp/ssm-params.json <<'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $FULL_IMAGE:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $FULL_IMAGE:latest"
            ]
          }
          SSMPARAMS

          # Send the command to the target instance
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command sent (ID=$COMMAND_ID). Waiting for completion..."

          # Wait until the command finishes
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION"

          echo "SSM command completed."

      - name: Verify deployment is healthy
        run: |
          set -e
          echo "=== Running health check against $PUBLIC_URL ==="
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL")
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Health check failed: received $HTTP_STATUS"
            exit 1
          else
            echo "Health check succeeded: received $HTTP_STATUS"
          fi