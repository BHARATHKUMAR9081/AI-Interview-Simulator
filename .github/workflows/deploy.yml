name: Build, Deploy and Verify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ECR_REPOSITORY_URI: ${{ secrets.ECR_REPOSITORY_URI }}
      INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
      PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
      DOCKERFILE_PATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli

      - name: Log into Amazon ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"

      - name: Build Docker image
        id: build-image
        run: |
          set -euo pipefail
          ECR_REGISTRY="$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"
          ECR_REPOSITORY="$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f2)"
          IMAGE_TAG="${{ github.sha::7 }}"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"

          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "FULL_IMAGE=$FULL_IMAGE" >> $GITHUB_ENV

          docker build \
            --pull \
            --platform linux/amd64 \
            -f "$DOCKERFILE_PATH/Dockerfile" \
            -t "$FULL_IMAGE:$IMAGE_TAG" \
            -t "$FULL_IMAGE:latest" \
            "$DOCKERFILE_PATH"

      - name: Push Docker image to ECR
        run: |
          set -euo pipefail
          docker push "$FULL_IMAGE:$IMAGE_TAG"
          docker push "$FULL_IMAGE:latest"

      - name: Deploy container to EC2 via SSM
        run: |
          set -euo pipefail

          cat > /tmp/ssm-params.json <<'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $FULL_IMAGE:$IMAGE_TAG",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $FULL_IMAGE:$IMAGE_TAG"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command sent (ID=$COMMAND_ID). Waiting for completion..."
          while true; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text)
            if [ "$STATUS" == "Success" ]; then
              echo "SSM Command completed successfully."
              break
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ] || [ "$STATUS" == "TimedOut" ]; then
              echo "SSM Command failed with status $STATUS"
              exit 1
            else
              sleep 2
            fi
          done

      - name: Health check
        run: |
          echo "Waiting for service to be reachable ..."
          for i in $(seq 1 30); do
            if curl -f "$PUBLIC_URL" >/dev/null 2>&1; then
              echo "Service responded with HTTP 200."
              exit 0
            fi
            echo "Attempt $i: retrying in 10s ..."
            sleep 10
          done
          echo "Health check failed: service did not respond within timeout."
          exit 1