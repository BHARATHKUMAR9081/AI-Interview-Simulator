name: Build, Deploy and Verify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-interview-simulator
      INSTANCE_ID: i-0a02453e4e5619a0c
      PUBLIC_URL: http://3.7.91.80
      TARGET_PORT: 80
      DOCKERFILE_PATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to Amazon ECR
        run: |
          set -e
          # Derive registry and repository
          ECR_REGISTRY=$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f1)
          ECR_REPOSITORY=$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f2)

          # Tag for the image
          IMAGE_TAG=${GITHUB_SHA::7}
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          IMAGE_URI="$FULL_IMAGE:latest"

          # Export for later steps
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> $GITHUB_ENV
          echo "FULL_IMAGE=$FULL_IMAGE" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

          echo "=== Logging in to Amazon ECR ==="
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

          echo "=== Building image $FULL_IMAGE:$IMAGE_TAG ==="
          docker build \
            --pull \
            --platform linux/amd64 \
            -t "$FULL_IMAGE:$IMAGE_TAG" \
            -t "$FULL_IMAGE:latest" \
            -f "$DOCKERFILE_PATH/Dockerfile" .

          echo "=== Pushing images ==="
          docker push "$FULL_IMAGE:$IMAGE_TAG"
          docker push "$FULL_IMAGE:latest"

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p ${TARGET_PORT}:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command sent (ID=$COMMAND_ID). Waiting for completion..."
          while true; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "CommandInvocations[0].Status" --output text)
            if [ "$STATUS" = "Success" ]; then
              echo "SSM Command succeeded."
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM Command failed with status $STATUS."
              exit 1
            else
              echo "Waiting for SSM command to finish... (status: $STATUS)"
              sleep 5
            fi
          done

      - name: Verify deployment health
        run: |
          set -e
          echo "Waiting for service to become available..."
          for attempt in $(seq 1 30); do
            if curl -fsSL $PUBLIC_URL > /dev/null; then
              echo "Service responded with HTTP 200."
              exit 0
            else
              echo "Attempt $attempt: Service not ready, retrying in 5s..."
              sleep 5
            fi
          done
          echo "Service did not respond with HTTP 200 after 30 attempts." >&2
          exit 1