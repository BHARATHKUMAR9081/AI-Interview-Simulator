name: Build, Push and Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli

      - name: Login to Amazon ECR
        run: |
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          aws ecr get-login-password --region "${{ secrets.AWS_REGION }}" | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Build and push Docker image
        run: |
          IMAGE_REPO="759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-interview-simulator"
          docker build -t $IMAGE_REPO:$GITHUB_SHA -t $IMAGE_REPO:latest .
          docker push $IMAGE_REPO:$GITHUB_SHA
          docker push $IMAGE_REPO:latest

      - name: Deploy to EC2 via SSM
        run: |
          REGION="${{ secrets.AWS_REGION }}"
          INSTANCE_ID="i-0735acdbaa33ddc3f"
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          ECR_REPOSITORY="ai-interview-simulator"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          cat > /tmp/ssm-params.json <<'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $${REGION} | docker login --username AWS --password-stdin $${ECR_REGISTRY}",
              "docker pull $${IMAGE_URI}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $${IMAGE_URI}"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          echo "SSM command submitted with ID: $COMMAND_ID"

      - name: Verify public endpoint
        run: |
          PUBLIC_URL="http://3.7.110.41"
          echo "Checking health endpoint at $PUBLIC_URL"
          if ! curl -fsSL $PUBLIC_URL >/dev/null; then
            echo "Health check failed: unable to reach service" >&2
            exit 1
          else
            echo "Health check succeeded: service is reachable"
          fi